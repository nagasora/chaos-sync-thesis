name: Experiment
description: 仮説を一つだけ検証する、再現可能な実験単位を記録する。
title: "[Experiment] "
labels:
  - experiment
body:
  - type: dropdown
    id: stage
    attributes:
      label: 対応する研究段階
      options:
        - E0
        - E1
        - E2
        - E3
        - E4-E5 extension
    validations:
      required: true
  - type: textarea
    id: hypothesis
    attributes:
      label: 仮説
      description: 検証可能な形で一つだけ記述する。
    validations:
      required: true
  - type: textarea
    id: baseline
    attributes:
      label: 基準実験
      description: 保持する既存設定・ベースライン・比較対象を明示する。
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: 今回の変更
      description: 変更する変数を一つに絞る。複数ある場合はIssueを分ける。
    validations:
      required: true
  - type: textarea
    id: metrics
    attributes:
      label: 指標と失敗条件
      description: 成功だけでなく、反証・識別不能・再実行が必要になる条件を記述する。
    validations:
      required: true
  - type: textarea
    id: artifacts
    attributes:
      label: 成果物パス
      description: 実行後に config、コード、結果メモ、図表への相対パスを追記する。
  - type: textarea
    id: conclusion
    attributes:
      label: 結果と次の判断
      description: 実行前は空欄でよい。実行した事実と未実行の計画を混ぜない。
